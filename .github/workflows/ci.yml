name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Configure Git fixtures
        run: |
          git config --global user.name "Scourgify CI"
          git config --global user.email "scourgify@example.invalid"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Check command-line entry points
        run: |
          python scripts/scourgify_scan.py --help
          python scripts/validate_closeout.py --help
      - name: Run scanner self-test
        run: python scripts/scourgify_scan.py --self-test
      - name: Run integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
